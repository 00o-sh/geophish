<html>
<body onload="getLocation()">
<script>
navigator.geolocation.getCurrentPosition(function(location) {
  fetch('/send', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({
      lat: location.coords.latitude,
      lon: location.coords.longitude
    })
  });
});
</script>
